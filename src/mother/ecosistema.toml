# Manifiesto único del ecosistema de herramientas de Programación I (UNRN Andina).
#
# Fuente de verdad para los scripts de p1-tools (clonado, instalación, salud),
# para el CI de integración (ecosistema-e2e) y para la documentación. Se lee
# con scripts/ecosistema.py (`listar`, `instalar`, `verificar`, …).
#
# Campos de cada [[repo]]:
#   nombre         identificador (y carpeta local salvo que `carpeta` diga otra)
#   carpeta        ruta local relativa a dev/tools, si difiere de `nombre`
#   url            repositorio git (las herramientas se instalan SIEMPRE desde acá:
#                  varios nombres de paquete están tomados en PyPI por terceros)
#   tipo           cli | biblioteca | extension-vscode | apps-script | contenido
#                  | plantilla | libreria-c | ejemplo | entorno | documentacion
#                  | android | especificacion | workflows | datos
#   paquete        nombre del paquete Python (tipo cli/biblioteca)
#   ejecutables    comandos que instala
#   extras         extras a instalar junto con el paquete
#   perfiles       estudiante | analisis | docente | contenido | aula
#   plugin_ripley  nombre del entry-point `ripley.plugins`, si tiene
#   sistema        programas del sistema que necesita (para doctor y el CI)
#   estado         activo | deprecado | retirado | especificacion | ajeno | sin-publicar
#                  (deprecado: todavía se clona y se instala, pero hay que dejar de usarlo;
#                  retirado: reemplazado por otra herramienta y con el repo archivado: no se
#                  clona ni se instala;
#                  sin-publicar: repo creado localmente que todavía no está en GitHub;
#                  no se clona ni se instala hasta publicarlo y pasarlo a activo)
schema_version = 1

[perfiles]
estudiante = "Herramientas de uso diario de los estudiantes (MANUAL_ESTUDIANTE.md)."
analisis = "Satélites de análisis de C que orquesta ripley."
docente = "Corrección, evaluación y gestión de la cursada."
contenido = "Producción de material: apunte, ejercicios, exámenes y bancos de preguntas."
aula = "Clases (Google Meet y Slides) y exámenes supervisados."

